[[Snippets]]
  Description = "Qemu create virtual machine"
  Output = ""
  Tag = []
  command = "qemu-system-x86_64  -enable-kvm  -m 4096  -smp cores=4  -cpu host  -drive file=./nixos.iso,media=cdrom  -drive file=./nixos.img,format=qcow2,if=virtio  -netdev user,id=net0,hostfwd=tcp::5555-:5555  -device virtio-net-pci,netdev=net0  -vga virtio  -display gtk  -usb  -device usb-tablet  -boot d "

